<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <title>Freddo Hosting — Accountpagina</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f5f6ff;
      font: 16px/1.6 system-ui, sans-serif;
      background: radial-gradient(ellipse at 20% 15%, #37316d 0, transparent 45%),
                  radial-gradient(ellipse at 85% 80%, #153b62 0, transparent 42%),
                  #101225;
    }
    main {
      width: min(100%, 600px); padding: 40px; text-align: center;
      border: 1px solid #ffffff22; border-radius: 24px;
      background: #ffffff0c; box-shadow: 0 24px 80px #0006;
      animation: appear .7s ease-out both;
    }
    .badge { color: #b8b5ff; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.1; }
    p { color: #c7c9dc; }
    a.button {
      display: inline-block; margin-top: 18px; padding: 12px 20px;
      border-radius: 12px; color: white; text-decoration: none; font-weight: 700;
      background: linear-gradient(100deg, #7567ff, #4d9cff);
      transition: transform .2s, filter .2s;
    }
    a.button:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .notice { margin-top: 24px; padding: 14px; border-radius: 12px; background: #ffffff0b; font-size: .9rem; }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="badge">Freddo Hosting</div>
    <h1>Welkom</h1>
    <p>Dit is de accountpagina. Gebruik uitsluitend officiële Discord-pagina’s voor Discord-aanmeldingen.</p>
    <a class="button"
       href="https://discord.com/oauth2/authorize?client_id=JOUW_APPLICATION_ID&amp;scope=identify"
       rel="noopener noreferrer">
      Officieel aanmelden via Discord
    </a>
    <div class="notice">
      Deel nooit je wachtwoord, autorisatiecode of Discord-token met iemand.
      Deze website vraagt daar niet om.
    </div>
  </main>
</body>
</html>
