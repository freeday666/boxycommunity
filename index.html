<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simulatie Game SignIn/SignUp</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet"/>
<style>
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    background: rgba(255,255,255,0.9);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    width: 90%;
    max-width: 400px;
    text-align: center;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  h1 {
    margin-bottom: 20px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  button {
    padding: 12px 24px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
    font-size: 16px;
  }
  button:hover {
    background: #45a049;
  }
  .links {
    margin-top: 15px;
  }
  .links button {
    background: #2196F3;
  }
  #generated {
    margin-top: 15px;
    font-family: monospace;
    background: #f4f4f4;
    padding: 10px;
    border-radius: 8px;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Simulatie Game Auth</h1>
  <div id="form-area">
    <input type="text" id="username" placeholder="Naam" />
    <input type="password" id="password" placeholder="Wachtwoord" />
    <button onclick="signIn()">Inloggen</button>
    <button onclick="showSignUp()">Aanmelden</button>
  </div>
  <div id="signup-area" style="display:none;">
    <input type="text" id="signup-name" placeholder="Nieuwe naam" />
    <input type="password" id="signup-pass" placeholder="Nieuw wachtwoord" />
    <button onclick="signUp()">Account aanmaken</button>
    <button onclick="showSignIn()">Terug</button>
  </div>
  <div class="links">
    <button onclick="generateRandom()">Genereer Naam & Wachtwoord</button>
  </div>
  <div id="generated"></div>
  <div style="margin-top:20px;">
    <a href="https://discord.gg/wWkTbc7YVg" target="_blank" style="text-decoration:none; font-weight:bold; padding:10px; background:#5865F2; color:white; border-radius:8px;">Join onze community</a>
  </div>
</div>

<script>
  function showSignUp() {
    document.getElementById('form-area').style.display='none';
    document.getElementById('signup-area').style.display='block';
  }
  function showSignIn() {
    document.getElementById('form-area').style.display='block';
    document.getElementById('signup-area').style.display='none';
  }

  function generateRandom() {
    const names = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Gamer', 'Player'];
    const passwords = ['pass123', 'qwerty', 'abc123', 'password', 'letmein', 'gaming'];
    const randName = names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 1000);
    const randPass = passwords[Math.floor(Math.random() * passwords.length)] + Math.floor(Math.random() * 999);
    document.getElementById('generated').innerHTML = `
      <strong>Naam:</strong> ${randName}<br>
      <strong>Wachtwoord:</strong> ${randPass}
    `;
    document.getElementById('generated').style.display='block';

    // Eventueel: Plaats deze code in localStorage of stuur naar je server voor verificatie
  }

  function signUp() {
    const name = document.getElementById('signup-name').value;
    const pass = document.getElementById('signup-pass').value;
    if(name && pass) {
      alert('Account aangemaakt! Gebruik deze in Discord met !auth code.');
      // Hier kan je de code genereren en tonen
      const authCode = Math.random().toString(36).substring(2,8).toUpperCase();
      alert(`Je verificatie code: ${authCode}\nGebruik !auth ${authCode} in Discord.`);
      // Opslaan of verzenden naar je backend
    } else {
      alert('Vul alle velden in.');
    }
  }

  function signIn() {
    const name = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    if(name && pass) {
      // Validatie via backend of localStorage
      alert('Ingelogd! Gebruik !auth in Discord met je code.');
    } else {
      alert('Vul alle velden in.');
    }
  }
</script>

</body>
</html>
