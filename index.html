<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maak met AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 14px system-ui, sans-serif;
      color: #eef2ff;
      background: #0b1020;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #11182b;
      border-bottom: 1px solid #28334d;
    }

    .logo { font-size: 18px; font-weight: 700; }
    .logo span { color: #8b72ff; }

    button {
      color: white;
      background: #202a42;
      border: 1px solid #34415e;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
    }

    button:hover { border-color: #8b72ff; }
    .run { background: #7357ff; border-color: #7357ff; }

    main {
      height: calc(100vh - 60px);
      display: grid;
      grid-template-columns: 310px 1fr 1fr;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #28334d;
      border-radius: 12px;
      background: #11182b;
    }

    .title {
      padding: 13px;
      border-bottom: 1px solid #28334d;
      font-weight: 700;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .bot { background: #1b2540; }
    .user { background: #4937a8; margin-left: 22px; }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #28334d;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 10px;
      color: white;
      background: #0b1020;
      border: 1px solid #34415e;
      border-radius: 8px;
      outline: none;
    }

    .editor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #28334d;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      padding: 14px;
      color: #dce6ff;
      background: #0b1020;
      border: 0;
      outline: none;
      font: 13px/1.6 monospace;
      tab-size: 2;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }

    @media (max-width: 850px) {
      main {
        height: auto;
        grid-template-columns: 1fr;
      }
      .panel { height: 55vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Maak<span>Studio</span></div>
    <button id="download">Download HTML</button>
  </header>

  <main>
    <section class="panel">
      <div class="title">💬 Vertel wat je wilt maken</div>
      <div id="messages">
        <div class="message bot">
          Hoi! Beschrijf een simpele website, bijvoorbeeld:
          “Maak een paarse pagina met een grote titel en een knop.”
        </div>
      </div>
      <form class="chat-form" id="chatForm">
        <input id="prompt" placeholder="Wat wil je maken?" autocomplete="off">
        <button class="run" type="submit">Maak</button>
      </form>
    </section>

    <section class="panel">
      <div class="editor-top">
        <strong>index.html</strong>
        <button class="run" id="run">▶ Preview</button>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
    </section>

    <section class="panel">
      <div class="title">👀 Voorbeeld</div>
      <iframe id="preview" title="Websitevoorbeeld" sandbox="allow-scripts"></iframe>
    </section>
  </main>

  <script>
    const starterCode = `<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn website</title>
</head>
<body>
  <h1>Mijn eerste website</h1>
  <p>Vertel links wat je wilt maken.</p>
  <button onclick="alert('Hallo!')">Klik op mij</button>
</body>
</html>`;

    const code = document.getElementById("code");
    const preview = document.getElementById("preview");
    const messages = document.getElementById("messages");

    code.value = starterCode;
    updatePreview();

    function updatePreview() {
      preview.srcdoc = code.value;
    }

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    }

    function makeWebsite(request) {
      const lower = request.toLowerCase();

      let color = "#7357ff";
      if (lower.includes("blauw")) color = "#2878ff";
      if (lower.includes("groen")) color = "#16a36a";
      if (lower.includes("rood")) color = "#e34b5f";
      if (lower.includes("zwart")) color = "#222222";
      if (lower.includes("oranje")) color = "#ed8b24";

      let title = "Welkom op mijn website";
      const titleMatch = request.match(/(?:over|voor|met de naam)\s+(.+)/i);
      if (titleMatch) title = titleMatch[1].replace(/[.!?]+$/, "");

      return `<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${escapeHtml(title)}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      text-align: center;
      color: #20243a;
      background: linear-gradient(135deg, ${color}22, white);
    }
    .card {
      max-width: 650px;
      padding: 48px 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px #17204420;
    }
    h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 0 0 16px; }
    p { color: #60677c; font-size: 1.1rem; }
    button {
      margin-top: 16px;
      padding: 13px 22px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: ${color};
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>${escapeHtml(title)}</h1>
    <p>Een website gemaakt met MaakStudio.</p>
    <button onclick="alert('Bedankt voor je bezoek!')">Klik hier</button>
  </main>
</body>
</html>`;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    document.getElementById("chatForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = document.getElementById("prompt");
      const request = input.value.trim();
      if (!request) return;

      addMessage(request, "user");
      code.value = makeWebsite(request);
      updatePreview();
      addMessage("Ik heb een voorbeeldwebsite gemaakt. Je kunt de code aanpassen in de editor!", "bot");
      input.value = "";
    });

    document.getElementById("run").addEventListener("click", updatePreview);

    code.addEventListener("input", updatePreview);

    document.getElementById("download").addEventListener("click", () => {
      const file = new Blob([code.value], { type: "text/html" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = "index.html";
      link.click();
      URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
