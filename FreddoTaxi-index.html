
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Freddo Taxi Roleplay</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b9d8;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;right:12px;pointer-events:none}
.panel{background:#101820dd;border:1px solid #ffffff33;border-radius:12px;padding:10px;margin-bottom:8px;text-shadow:1px 1px #000}
#money{font-size:20px;color:#72ff9a;font-weight:bold}
#message{font-size:14px}
#map{position:fixed;right:12px;top:12px;width:125px;height:125px;border:2px solid white;border-radius:50%;background:#253b35dd}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;align-items:end}
.group{display:flex;gap:10px;align-items:center}
button{width:58px;height:58px;border-radius:16px;border:2px solid #ffffff66;background:#14212de8;color:white;font-size:22px;font-weight:bold;touch-action:none}
button:active{background:#f5c542;color:#111}
#jobs{position:fixed;left:12px;bottom:155px;display:flex;gap:6px;flex-wrap:wrap;max-width:75%}
.small{width:auto;height:auto;padding:10px;font-size:13px;border-radius:9px}
#hint{position:fixed;top:155px;left:12px;font-size:12px;background:#101820cc;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="panel">
    <b>🚕 FREDDO TAXI ROLEPLAY</b><br>
    <span id="money">€ 1.000</span> · <span id="job">Taxi chauffeur</span>
    <div id="message">Welkom! Rijd naar de gele passagiersmarker.</div>
  </div>
</div>
<canvas id="map" width="125" height="125"></canvas>
<div id="hint">🟡 Passagier · 🔴 Bestemming<br>Camera: V · Instappen: E</div>
<div id="jobs">
  <button class="small" onclick="changeJob('Taxi chauffeur')">🚕 Taxi</button>
  <button class="small" onclick="changeJob('Bezorger')">📦 Bezorger</button>
  <button class="small" onclick="changeJob('Politie')">🚓 Politie</button>
  <button class="small" onclick="toggleCamera()">🎥 Camera</button>
</div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button><button id="right">▶</button>
  </div>
  <div class="group">
    <button id="brake">▼</button><button id="gas">▲</button><button id="interact">E</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const root=document.getElementById('game');
if(!window.THREE){document.getElementById('message').textContent='Geen internet: de 3D-engine kon niet laden.';return}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ac9e7);
scene.fog=new THREE.Fog(0x9ac9e7,90,260);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x596c54,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});
const grass=mat(0x63875b),road=mat(0x343a40),line=mat(0xf3e6a0);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);
ground.rotation.x=-Math.PI/2;ground.position.y=-.12;scene.add(ground);
const buildings=[];
function block(x,z,w,d,h,color){
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 b.position.set(x,h/2,z);scene.add(b);buildings.push(b);
 const windows=mat(0xa9d8e9);
 for(let y=1.5;y<h-0.5;y+=2.2)for(let xx=-w/2+1;xx<w/2-0.5;xx+=2){
  const win=new THREE.Mesh(new THREE.BoxGeometry(.65,.85,.06),windows);
  win.position.set(x+xx,y,z+d/2+.04);scene.add(win);
 }
}
for(let i=-4;i<=4;i++){
 const p=i*32;
 const r1=new THREE.Mesh(new THREE.BoxGeometry(500,.08,12),road);r1.position.set(0,0,p);scene.add(r1);
 const r2=new THREE.Mesh(new THREE.BoxGeometry(12,.08,500),road);r2.position.set(p,0,0);scene.add(r2);
 for(let j=-7;j<=7;j++){
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(2,.04,.18),line);
  stripe.position.set(j*4,.06,p);scene.add(stripe);
 }
}
const colors=[0xc9bba2,0xb4c7d3,0xd1a99b,0xaaa8bf,0xd7d3bb,0x8eafa3];
for(let x=-4;x<=4;x++)for(let z=-4;z<=4;z++){
 if(Math.abs(x*32)<20||Math.abs(z*32)<20)continue;
 block(x*32+(x%2?11:-11),z*32+(z%2?11:-11),12+Math.random()*6,12+Math.random()*6,8+Math.random()*23,colors[Math.floor(Math.random()*colors.length)]);
}
function car(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.7,4),mat(color));body.position.y=.75;g.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.7,1.8),mat(0x9bc4d5));cabin.position.set(0,1.35,-.15);g.add(cabin);
 const black=mat(0x171a1d);
 for(const x of [-.92,.92])for(const z of [-1.25,1.25]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.22,12),black);
  wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);g.add(wheel);
 }
 return g;
}
const taxi=car(0xf2c51b);taxi.position.set(0,0,0);scene.add(taxi);
const npc= new THREE.Group();
const person=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,1.5,8),mat(0x2c66ce));person.position.y=.85;npc.add(person);
const head=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),mat(0xe3b18a));head.position.y=1.8;npc.add(head);
npc.position.set(16,0,-8);scene.add(npc);
const marker=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,.12,20),mat(0xffdd22));
marker.position.set(16,.12,-8);scene.add(marker);
const dest=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,.12,20),mat(0xff4433));
dest.position.set(-48,.12,32);scene.add(dest);
let money=1000,speed=0,steer=0,firstPerson=false,hasPassenger=false,delivering=false;
const keys={left:false,right:false,gas:false,brake:false};
function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false);
}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
function changeJob(j){document.getElementById('job').textContent=j;document.getElementById('message').textContent='Je werkt nu als '+j+'. Rijd veilig door de stad.'}
window.changeJob=changeJob;
function toggleCamera(){firstPerson=!firstPerson;document.getElementById('message').textContent=firstPerson?'Cockpitcamera ingeschakeld':'Derdepersoonscamera ingeschakeld'}
window.toggleCamera=toggleCamera;
function interact(){
 if(!hasPassenger&&taxi.position.distanceTo(npc.position)<7){
  hasPassenger=true;scene.remove(npc);scene.remove(marker);delivering=true;
  document.getElementById('message').textContent='Passagier ingestapt! Rijd naar de rode bestemming.';
 }else if(delivering&&taxi.position.distanceTo(dest.position)<8){
  money+=250;document.getElementById('money').textContent='€ '+money.toLocaleString('nl-NL');
  delivering=false;hasPassenger=false;dest.position.set(taxi.position.x+60,0,taxi.position.z-45);
  npc.position.set(taxi.position.x-25,0,taxi.position.z+30);scene.add(npc);marker.position.set(npc.position.x,.12,npc.position.z);scene.add(marker);
  document.getElementById('message').textContent='Rit voltooid! Je verdient € 250. Nieuwe passagier beschikbaar.';
 }else document.getElementById('message').textContent='Rijd naar de gele blip en druk op E.';
}
document.getElementById('interact').addEventListener('click',interact);
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.gas=true;
 if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.brake=true;
 if(e.key.toLowerCase()==='e')interact();
 if(e.key.toLowerCase()==='v')toggleCamera();
});
addEventListener('keyup',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;
 if(['ArrowRight','d','D'].includes(e.key))keys.right=false;
 if(['ArrowUp','w','W'].includes(e.key))keys.gas=false;
 if(['ArrowDown','s','S'].includes(e.key))keys.brake=false;
});
const map=document.getElementById('map'),ctx=map.getContext('2d');
function drawMap(){
 ctx.clearRect(0,0,125,125);ctx.fillStyle='#263b35';ctx.fillRect(0,0,125,125);
 ctx.strokeStyle='#626b70';ctx.lineWidth=5;
 for(let i=-4;i<=4;i++){let p=62.5+i*16;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,125);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(125,p);ctx.stroke()}
 function dot(pos,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(62.5+(pos.x-taxi.position.x)*1.1,62.5+(pos.z-taxi.position.z)*1.1,4,0,Math.PI*2);ctx.fill()}
 dot(taxi.position,'#ffffff');if(!hasPassenger)dot(npc.position,'#ffdf25');else dot(dest.position,'#ff453a');
}
function animate(){
 requestAnimationFrame(animate);
 if(keys.gas)speed=Math.min(speed+.012,.48);else speed*=.985;
 if(keys.brake)speed=Math.max(speed-.025,-.18);
 if(keys.left)steer=Math.min(steer+.045,.55);else if(keys.right)steer=Math.max(steer-.045,-.55);else steer*=.85;
 taxi.rotation.y+=steer*speed*1.7;
 taxi.position.x+=Math.sin(taxi.rotation.y)*speed;
 taxi.position.z+=Math.cos(taxi.rotation.y)*speed;
 taxi.position.x=Math.max(-145,Math.min(145,taxi.position.x));
 taxi.position.z=Math.max(-145,Math.min(145,taxi.position.z));
 if(firstPerson){
  const offset=new THREE.Vector3(0,1.55,-.15).applyAxisAngle(new THREE.Vector3(0,1,0),taxi.rotation.y);
  camera.position.set(taxi.position.x+offset.x,taxi.position.y+offset.y,taxi.position.z+offset.z);
  const dir=new THREE.Vector3(Math.sin(taxi.rotation.y),.05,Math.cos(taxi.rotation.y));
  camera.lookAt(camera.position.clone().add(dir));
 }else{
  const offset=new THREE.Vector3(0,5,-9).applyAxisAngle(new THREE.Vector3(0,1,0),taxi.rotation.y);
  camera.position.lerp(new THREE.Vector3(taxi.position.x+offset.x,offset.y,taxi.position.z+offset.z),.12);
  camera.lookAt(taxi.position.x,1,taxi.position.z);
 }
 marker.rotation.y+=.02;dest.rotation.y-=.02;
 drawMap();renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
})();
</script>
</body>
</html>
